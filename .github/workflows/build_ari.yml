name: Build Zeal ARI (experimental)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Zeal Release x86
        shell: pwsh
        run: msbuild Zeal.sln /m /p:Configuration=Release /p:Platform=x86 /p:LanguageStandard=stdcpp20 /p:ExportHeader="" /p:ScanDependencies=""
      - uses: actions/upload-artifact@v4
        with:
          name: Zeal-1.4.8-ARI-experimental
          path: Release/Zeal.asi
